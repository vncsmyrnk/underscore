version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  settings:
    depguard:
      rules:
        no-cmd-imports:
          files:
            - "!cmd/**"
          allow:
            - $gostd
            - github.com/vncsmyrnk/underscore/internal
          deny:
            - pkg: github.com/vncsmyrnk/underscore/cmd
              desc: command entry points must only be referenced from composition roots
